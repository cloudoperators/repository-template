name: Release Docker

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  docker-release:
    uses: cloudoperators/common/.github/workflows/shared-docker-release.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      image-name: ghcr.io/cloudoperators/REPLACE_WITH_REPO_NAME
